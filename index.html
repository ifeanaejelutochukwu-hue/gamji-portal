<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gamji College of Nursing Sciences, Sokoto</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              nursing: {
                50: '#F2FBF7',
                100: '#E1F7EB',
                200: '#C3ECD9',
                300: '#96DBBF',
                400: '#5EBF98',
                500: '#34A87C',
                600: '#0E8A53', // Brand Primary
                700: '#096E44',
                800: '#085737',
                900: '#07472E',
              }
            },
            animation: {
              'heartbeat': 'heartbeat 3s ease-in-out infinite',
              'fade-in-up': 'fadeInUp 0.8s ease-out forwards',
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            },
            keyframes: {
              heartbeat: {
                '0%, 100%': { transform: 'scale(1)' },
                '10%': { transform: 'scale(1.1)' },
                '20%': { transform: 'scale(1)' },
                '30%': { transform: 'scale(1.1)' },
                '40%': { transform: 'scale(1)' },
              },
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              }
            }
          }
        }
      }
    </script>
  <script type="importmap">
{
  "imports": {
    "@supabase/supabase-js": "https://aistudiocdn.com/@supabase/supabase-js@^2.86.2",
    "react-dom/client": "https://aistudiocdn.com/react-dom@^19.2.1/client",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.555.0",
    "react-router-dom": "https://aistudiocdn.com/react-router-dom@^6.22.3",
    "next": "https://aistudiocdn.com/next@^16.0.8",
    "next/": "https://aistudiocdn.com/next@^16.0.8/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-nursing-50 text-slate-900 antialiased selection:bg-nursing-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
